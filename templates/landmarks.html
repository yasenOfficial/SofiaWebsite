<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Sofia Virtual Tour</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet & Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="bg-primary text-white text-center py-3 shadow-sm">
        <h1 class="h4 mb-0"><i class="fas fa-landmark me-2"></i>Sofia Virtual Heritage Walk</h1>
    </header>

    <!-- Main container -->
    <main class="flex-grow-1 position-relative">
        <div class="container-fluid p-0 h-100">
            <!-- <div id="map" class="w-100 h-100"></div> -->

            <!-- Carousel -->
            <div id="carouselContainer" class="position-absolute top-0 start-0 w-100 h-100 d-none overlay-ui">
                <div id="landmarkCarousel" class="carousel slide h-100" data-bs-ride="carousel">
                    <div class="carousel-inner h-100" id="carouselInner"></div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#landmarkCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#landmarkCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>

            <!-- Street View iframe -->
            <iframe id="streetview" allowfullscreen
                class="position-absolute top-0 start-0 w-100 h-100 d-none border-0"></iframe>
        </div>

        <!-- Landmark list -->
        <div id="landmarkList" class="card position-absolute top-0 end-0 m-3 shadow-lg d-none overlay-ui">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span><i class="fas fa-map-marker-alt me-1"></i>Landmarks</span>
                <button id="closeListBtn" class="btn btn-sm btn-light"><i class="fas fa-times"></i></button>
            </div>
            <div class="card-body p-2" id="landmarkItems"></div>
        </div>

        <button id="toggleListBtn"
            class="btn btn-light rounded-circle shadow position-absolute top-0 end-0 m-3 overlay-ui">
            <i class="fas fa-list text-primary"></i>
        </button>

        <!-- Info card -->
        <div id="info"
            class="card overlay-ui position-absolute bottom-0 start-50 translate-middle-x mb-3 shadow-lg w-75 w-md-50">
            <div class="card-body">
                <h5 class="card-title mb-2" id="infoTitle">Баните</h5>
                <p class="card-text text-muted" id="infoDesc">Historic public baths built during Ottoman period.</p>

                <div class="progress mb-3" style="height: 6px;">
                    <div class="progress-bar" id="progressFill" role="progressbar" style="width: 41.6667%;"></div>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <span class="badge bg-light text-primary border" id="landmarkCounter">5 / 12</span>
                    <button class="btn btn-primary btn-sm d-none" id="startTourBtn">
                        <i class="fas fa-play me-1"></i>Start Tour
                    </button>
                    <button class="btn btn-outline-primary btn-sm" id="prevBtn">
                        <i class="fas fa-arrow-left me-1"></i>Prev
                    </button>
                    <button class="btn btn-outline-primary btn-sm" id="nextBtn">
                        Next<i class="fas fa-arrow-right ms-1"></i>
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" id="backToMapBtn">
                        <i class="fas fa-map me-1"></i>Map
                    </button>
                    <button class="btn btn-outline-success btn-sm d-none" id="toggleStreetViewBtn">
                        <i class="fas fa-street-view me-1"></i>View Street
                    </button>
                </div>
            </div>
        </div>
    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
